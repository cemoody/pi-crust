name: release

# Release only after the CI workflow for a main commit has succeeded. Workflows
# triggered by the release commit itself are skipped by its [skip ci] message.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next release without publishing
        required: false
        default: false
        type: boolean
      recover_full_version:
        description: Publish only pi-crust-full at this existing pi-crust version
        required: false
        type: string

# npm trusted publishing exchanges this workflow's GitHub OIDC identity for a
# short-lived npm credential. Configure the matching trusted publisher once in
# npm for package "pi-crust", repository cemoody/pi-crust, workflow
# .github/workflows/release.yml, environment production (if used).
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: publish npm package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release creates the release tag; package versions are
          # intentionally not committed back to protected main.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm >=11.5.1. Node 22.22 ships npm
          # 10, so the job upgrades npm before any publish command runs.
          node-version: 22.22.2
          cache: npm
          registry-url: https://registry.npmjs.org
          # npm's trusted-publisher exchange is performed directly by
          # semantic-release; do not inject a registry auth token.
          always-auth: false

      - name: upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1 --no-audit --no-fund

      - name: install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: recover pi-crust-full publication
        if: inputs.recover_full_version != ''
        run: node scripts/publish-pi-crust-full.mjs "${{ inputs.recover_full_version }}"

      - name: preview release
        if: inputs.recover_full_version == '' && inputs.dry_run == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release --dry-run

      - name: publish
        if: inputs.recover_full_version == '' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
